<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小小背单词</title>
<style>
  * {
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    color: #000;
  }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 36px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  #app {
    width: 100%;
    max-width: 1236px;
    margin: 0 auto;
    padding: 40px;
  }
  button {
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
  }
  .topbar {
    width: 100%;
    border-collapse: collapse;
    margin: 0 0 24px 0;
  }
  .topbar td {
    padding: 0 0 16px 0;
    vertical-align: middle;
    border-bottom: 3px solid #000;
    font-size: 32px;
  }
  .topbar td.right {
    text-align: right;
  }
  .title {
    font-size: 48px;
    font-weight: bold;
    margin: 0 0 24px 0;
    line-height: 1.3;
  }
  .hint {
    font-size: 34px;
    margin: 0 0 24px 0;
    line-height: 1.5;
  }
  .smallnote {
    font-size: 26px;
    margin: 24px 0 0 0;
    line-height: 1.5;
  }
  .word {
    font-size: 104px;
    font-weight: bold;
    text-align: center;
    margin: 48px 0 16px 0;
    line-height: 1.15;
    word-wrap: break-word;
  }
  .meaning {
    font-size: 56px;
    font-weight: bold;
    text-align: center;
    margin: 0 0 32px 0;
  }
  .meaning-big {
    font-size: 88px;
    font-weight: bold;
    text-align: center;
    margin: 40px 0 32px 0;
    line-height: 1.3;
  }
  .example {
    font-size: 34px;
    text-align: center;
    border-top: 3px solid #000;
    border-bottom: 3px solid #000;
    padding: 24px 0;
    margin: 0 0 40px 0;
  }
  .direction {
    font-size: 34px;
    margin: 0 0 8px 0;
  }
  .primary {
    display: block;
    width: 100%;
    min-height: 120px;
    margin: 24px 0 0 0;
    padding: 20px 24px;
    border: 4px solid #000;
    border-radius: 8px;
    background: #000;
    color: #fff;
    font-size: 40px;
    font-weight: bold;
    text-align: center;
  }
  .primary:disabled {
    background: #fff;
    color: #000;
    border-style: dashed;
  }
  .secondary {
    display: block;
    width: 100%;
    min-height: 100px;
    margin: 20px 0 0 0;
    padding: 16px 24px;
    border: 3px solid #000;
    border-radius: 8px;
    background: #fff;
    color: #000;
    font-size: 34px;
    font-weight: bold;
    text-align: center;
  }
  .small {
    border: 3px solid #000;
    border-radius: 6px;
    background: #fff;
    color: #000;
    font-size: 28px;
    padding: 10px 22px;
  }
  .opt {
    display: block;
    width: 100%;
    min-height: 110px;
    margin: 0 0 16px 0;
    padding: 16px 28px;
    border: 4px solid #000;
    border-radius: 8px;
    background: #fff;
    color: #000;
    font-size: 38px;
    font-weight: bold;
    text-align: left;
    line-height: 1.4;
  }
  .opt.ok2 {
    background: #000;
    color: #fff;
  }
  .opt.bad {
    border-style: dashed;
    background: #fff;
    color: #000;
  }
  .feedback {
    min-height: 120px;
    padding: 16px 0;
    font-size: 36px;
    font-weight: bold;
    line-height: 1.4;
  }
  .keypad {
    width: 100%;
    border-collapse: separate;
    border-spacing: 12px;
    margin: 0;
  }
  .keypad td {
    padding: 0;
    width: 33.33%;
  }
  .key {
    display: block;
    width: 100%;
    min-height: 110px;
    border: 3px solid #000;
    border-radius: 8px;
    background: #fff;
    color: #000;
    font-size: 44px;
    font-weight: bold;
    text-align: center;
  }
  .key:active, .opt:active {
    background: #000;
    color: #fff;
  }
  .primary:active {
    background: #fff;
    color: #000;
  }
  .codebox {
    border-collapse: separate;
    border-spacing: 10px;
    margin: 24px 0 8px 0;
  }
  .codecell {
    width: 64px;
    height: 84px;
    border: 4px solid #000;
    border-radius: 8px;
    text-align: center;
    font-size: 44px;
    font-weight: bold;
    line-height: 84px;
  }
  .err {
    min-height: 56px;
    margin: 0 0 8px 0;
    font-size: 30px;
    font-weight: bold;
    line-height: 1.4;
  }
  .stats {
    width: 100%;
    border-collapse: separate;
    border-spacing: 16px;
    margin: 24px 0;
  }
  .stats td {
    width: 50%;
    border: 3px solid #000;
    border-radius: 8px;
    padding: 24px 12px;
    text-align: center;
    vertical-align: middle;
  }
  .num {
    font-size: 52px;
    font-weight: bold;
    line-height: 1.3;
  }
  .cap {
    font-size: 28px;
  }
  .bigcard {
    border: 3px solid #000;
    border-radius: 8px;
    padding: 32px;
    margin: 24px 0;
  }
  .bigline {
    font-size: 40px;
    font-weight: bold;
    margin: 8px 0;
  }
</style>
</head>
<body>
<div id="app"><div id="screen"></div></div>

<script>
(function () {
  var LS_KEY = 'kv_kid_state_v1';
  var LOGIN_CODE = '123456';

  var WORDS = {
    apple: { word: 'apple', meaning: '苹果', example: 'I see an apple.' },
    book: { word: 'book', meaning: '书', example: 'This is my book.' },
    red: { word: 'red', meaning: '红色', example: 'My bag is red.' },
    cat: { word: 'cat', meaning: '猫', example: 'The cat is small.' },
    dog: { word: 'dog', meaning: '狗', example: 'I like my dog.' },
    school: { word: 'school', meaning: '学校', example: 'I go to school.' }
  };
  var ORDER = ['apple', 'book', 'red', 'cat', 'dog', 'school'];

  var state = null;

  function defaultState() {
    return {
      screen: 'login',
      code: '',
      task: [],
      idx: 0,
      retry: [],
      retryIdx: 0,
      inRetry: false,
      answered: false,
      selected: '',
      firstAnswered: 0,
      firstCorrect: 0,
      started: false,
      finished: false,
      pausedScreen: '',
      message: ''
    };
  }

  function load() {
    var raw = '';
    try {
      raw = window.localStorage.getItem(LS_KEY) || '';
    } catch (e) {
      raw = '';
    }
    if (!raw) {
      state = defaultState();
      return;
    }
    try {
      var obj = JSON.parse(raw);
      state = defaultState();
      for (var k in obj) {
        if (obj.hasOwnProperty(k)) {
          state[k] = obj[k];
        }
      }
      if (!state.task || !state.task.length) {
        if (state.screen !== 'login' && state.screen !== 'home') {
          state.screen = 'home';
        }
      }
      if (state.screen === 'question' || state.screen === 'card') {
        state.answered = false;
        state.selected = '';
      }
    } catch (e2) {
      state = defaultState();
    }
  }

  function save() {
    try {
      window.localStorage.setItem(LS_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function buildTask() {
    return [
      { key: 'apple', type: 'new' },
      { key: 'book', type: 'new' },
      { key: 'red', type: 'new' },
      { key: 'cat', type: 'review' },
      { key: 'dog', type: 'review' }
    ];
  }

  function currentItem() {
    return state.inRetry ? state.retry[state.retryIdx] : state.task[state.idx];
  }

  function currentSeq() {
    return state.inRetry ? state.retryIdx : state.idx;
  }

  function makeQuestion(item, seq) {
    var askEnglish = (seq % 2 === 0);
    var others = [];
    var i;
    for (i = 0; i < ORDER.length; i++) {
      if (ORDER[i] !== item.key) {
        others.push(ORDER[i]);
      }
    }
    var picked = [];
    for (i = 0; i < 3; i++) {
      picked.push(others[(seq + i) % others.length]);
    }
    var answerPos = seq % 4;
    var options = [];
    var p = 0;
    for (i = 0; i < 4; i++) {
      var key;
      if (i === answerPos) {
        key = item.key;
      } else {
        key = picked[p];
        p = p + 1;
      }
      options.push({
        key: key,
        label: askEnglish ? WORDS[key].meaning : WORDS[key].word,
        correct: key === item.key
      });
    }
    return {
      askEnglish: askEnglish,
      direction: askEnglish ? '看英文，选中文' : '看中文，选英文',
      prompt: askEnglish ? WORDS[item.key].word : WORDS[item.key].meaning,
      answerKey: item.key,
      answerLabel: askEnglish ? WORDS[item.key].meaning : WORDS[item.key].word,
      options: options
    };
  }

  function countNew() {
    var n = 0;
    for (var i = 0; i < state.task.length; i++) {
      if (state.task[i].type === 'new') {
        n = n + 1;
      }
    }
    return n;
  }

  function progressLabel() {
    var item = currentItem();
    if (state.inRetry) {
      return '错词重练 ' + (state.retryIdx + 1) + ' / ' + state.retry.length;
    }
    return (item.type === 'new' ? '新词答题' : '复习') + ' ' + (state.idx + 1) + ' / ' + state.task.length;
  }

  function topbar(left, right) {
    return '<table class="topbar"><tr><td>' + left + '</td><td class="right">' + right + '</td></tr></table>';
  }

  function viewLogin() {
    var cells = '';
    var i;
    for (i = 0; i < 6; i++) {
      var ch = state.code.charAt(i);
      cells = cells + '<td class="codecell" id="c' + i + '">' + (ch ? ch : '&nbsp;') + '</td>';
    }
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '清空', '0', '删除'];
    var rows = '';
    var r;
    var c;
    for (r = 0; r < 4; r++) {
      rows = rows + '<tr>';
      for (c = 0; c < 3; c++) {
        rows = rows + '<td><button type="button" class="key" id="k' + r + '' + c + '">' + keys[r * 3 + c] + '</button></td>';
      }
      rows = rows + '</tr>';
    }
    var html = '';
    html = html + topbar('儿童学习入口', '<span>家长请用家长端</span>');
    html = html + '<h1 class="title">输入 6 位学习码</h1>';
    html = html + '<p class="hint">学习码由家长提供，本次演示为 123456。</p>';
    html = html + '<table class="codebox"><tr>' + cells + '</tr></table>';
    html = html + '<p class="err" id="msg">' + state.message + '</p>';
    html = html + '<table class="keypad">' + rows + '</table>';
    html = html + '<button type="button" class="primary" id="loginBtn"' + (state.code.length === 6 ? '' : ' disabled="disabled"') + '>进入学习</button>';
    html = html + '<p class="smallnote">这是真机测试版，学习记录只保存在这台设备上，不会上传。</p>';
    return html;
  }

  function viewHome() {
    var preview = (state.task && state.task.length) ? state.task : buildTask();
    var total = preview.length;
    var newCount = 0;
    var pi;
    for (pi = 0; pi < preview.length; pi++) {
      if (preview[pi].type === 'new') {
        newCount = newCount + 1;
      }
    }
    var html = '';
    if (state.finished) {
      html = html + topbar('你好，小小', '已获得 1 颗星');
      html = html + '<h1 class="title">今天的学习已完成</h1>';
      html = html + '<div class="bigcard"><p class="bigline">连续学习 1 天</p><p class="bigline">获得 1 颗星</p></div>';
      html = html + '<p class="hint">明天再来复习。现在可以回到 Kindle 看书。</p>';
      html = html + '<button type="button" class="primary" id="resultBtn">再看一次结果</button>';
    } else if (state.started) {
      html = html + topbar('你好，小小', '今日任务');
      html = html + '<h1 class="title">继续今天的学习</h1>';
      html = html + '<p class="hint">已完成 ' + state.idx + ' / ' + total + ' 题，接着上次的位置继续。</p>';
      html = html + '<button type="button" class="primary" id="startBtn">继续学习</button>';
    } else {
      html = html + topbar('你好，小小', '今日任务');
      html = html + '<h1 class="title">准备好学习了吗？</h1>';
      html = html + '<p class="hint">今天有 ' + newCount + ' 个新词和 ' + (total - newCount) + ' 个复习词，一共 ' + total + ' 道题，没有倒计时。</p>';
      html = html + '<button type="button" class="primary" id="startBtn">开始学习</button>';
    }
    html = html + '<button type="button" class="secondary" id="logoutBtn">退出学习入口</button>';
    return html;
  }

  function viewCard() {
    var item = state.task[state.idx];
    var w = WORDS[item.key];
    var html = '';
    html = html + topbar('新词 ' + (state.idx + 1) + ' / ' + countNew(), '<button type="button" class="small" id="pauseBtn">暂停</button>');
    html = html + '<div class="word">' + w.word + '</div>';
    html = html + '<div class="meaning">' + w.meaning + '</div>';
    html = html + '<div class="example">' + w.example + '</div>';
    html = html + '<button type="button" class="primary" id="knowBtn">我认识了</button>';
    return html;
  }

  function nextLabel() {
    if (state.inRetry) {
      return state.retryIdx === state.retry.length - 1 ? '完成重练' : '下一题';
    }
    if (state.idx < state.task.length - 1) {
      return '下一题';
    }
    if (state.retry.length > 0) {
      return '开始错词重练';
    }
    return '查看结果';
  }

  function viewQuestion() {
    var q = makeQuestion(currentItem(), currentSeq());
    var html = '';
    html = html + topbar(progressLabel(), '<button type="button" class="small" id="pauseBtn">暂停</button>');
    html = html + '<p class="direction">' + q.direction + '</p>';
    html = html + '<div class="' + (q.askEnglish ? 'word' : 'meaning-big') + '">' + q.prompt + '</div>';
    var i;
    for (i = 0; i < q.options.length; i++) {
      var cls = 'opt';
      if (state.answered) {
        if (q.options[i].correct) {
          cls = 'opt ok2';
        } else if (state.selected === q.options[i].key) {
          cls = 'opt bad';
        }
      }
      html = html + '<button type="button" class="' + cls + '" id="opt' + i + '">' + q.options[i].label + '</button>';
    }
    html = html + '<div class="feedback" id="feedback">';
    if (state.answered) {
      html = html + feedbackText(q);
    } else {
      html = html + '&nbsp;';
    }
    html = html + '</div>';
    html = html + '<div id="nextWrap">';
    if (state.answered) {
      html = html + '<button type="button" class="primary" id="nextBtn">' + nextLabel() + '</button>';
    }
    html = html + '</div>';
    return html;
  }

  function feedbackText(q) {
    if (state.selected === q.answerKey) {
      return '答对了。';
    }
    return '这次不对，正确答案是「' + q.answerLabel + '」。';
  }

  function updateQuestion() {
    var q = makeQuestion(currentItem(), currentSeq());
    var i;
    for (i = 0; i < q.options.length; i++) {
      var el = document.getElementById('opt' + i);
      if (el) {
        if (q.options[i].correct) {
          el.className = 'opt ok2';
        } else if (state.selected === q.options[i].key) {
          el.className = 'opt bad';
        } else {
          el.className = 'opt';
        }
      }
    }
    var fb = document.getElementById('feedback');
    if (fb) {
      fb.innerHTML = feedbackText(q);
    }
    var wrap = document.getElementById('nextWrap');
    if (wrap && !document.getElementById('nextBtn')) {
      wrap.innerHTML = '<button type="button" class="primary" id="nextBtn">' + nextLabel() + '</button>';
      onTap(document.getElementById('nextBtn'), advance);
    }
  }

  function viewResult() {
    var wrong = '';
    var i;
    for (i = 0; i < state.retry.length; i++) {
      if (i > 0) {
        wrong = wrong + '、';
      }
      wrong = wrong + WORDS[state.retry[i].key].word + '（' + WORDS[state.retry[i].key].meaning + '）';
    }
    var html = '';
    html = html + topbar('本次学习结果', '已保存');
    html = html + '<h1 class="title">任务完成，获得 1 颗星</h1>';
    html = html + '<table class="stats"><tr>';
    html = html + '<td><div class="num">' + state.firstCorrect + ' / ' + state.firstAnswered + '</div><div class="cap">首次答对</div></td>';
    html = html + '<td><div class="num">1 天</div><div class="cap">连续学习</div></td>';
    html = html + '</tr></table>';
    html = html + '<p class="hint">' + (wrong ? '需要继续巩固：' + wrong : '这次没有首次答错的单词。') + '</p>';
    html = html + '<p class="hint">答错不扣星星，之后还会再见到这些词。</p>';
    html = html + '<button type="button" class="primary" id="homeBtn">回到首页</button>';
    return html;
  }

  function render() {
    if (!state.task) {
      state.task = [];
    }
    var html = '';
    if (state.screen === 'login') {
      html = viewLogin();
    } else if (state.screen === 'home') {
      html = viewHome();
    } else if (state.screen === 'card') {
      html = viewCard();
    } else if (state.screen === 'question') {
      html = viewQuestion();
    } else {
      html = viewResult();
    }
    document.getElementById('screen').innerHTML = html;
    bindCurrent();
  }

  function updateLogin() {
    var i;
    for (i = 0; i < 6; i++) {
      var cell = document.getElementById('c' + i);
      if (cell) {
        var ch = state.code.charAt(i);
        if (typeof cell.textContent === 'string') {
          cell.textContent = ch ? ch : '';
        } else {
          cell.innerHTML = ch ? ch : '&nbsp;';
        }
      }
    }
    var msg = document.getElementById('msg');
    if (msg) {
      msg.innerHTML = state.message;
    }
    var btn = document.getElementById('loginBtn');
    if (btn) {
      btn.disabled = (state.code.length !== 6);
    }
  }

  function pressKey(k) {
    state.message = '';
    if (k === '清空') {
      state.code = '';
    } else if (k === '删除') {
      state.code = state.code.substring(0, state.code.length - 1);
    } else if (state.code.length < 6) {
      state.code = state.code + k;
    }
    updateLogin();
  }

  function doLogin() {
    if (state.code !== LOGIN_CODE) {
      state.message = '学习码不正确，请和家长确认。';
      state.code = '';
      render();
      return;
    }
    state.code = '';
    state.message = '';
    state.screen = 'home';
    save();
    render();
  }

  function startTask() {
    if (!state.task.length) {
      state.task = buildTask();
    }
    state.started = true;
    state.idx = 0;
    goToCurrent();
    save();
    render();
  }

  function goToCurrent() {
    var item = currentItem();
    if (!item) {
      state.screen = 'home';
      return;
    }
    if (!state.inRetry && item.type === 'new') {
      state.screen = 'card';
    } else {
      state.screen = 'question';
    }
    state.answered = false;
    state.selected = '';
    state.pausedScreen = '';
  }

  function resume() {
    if (state.pausedScreen === 'card' || state.pausedScreen === 'question') {
      state.screen = state.pausedScreen;
    } else {
      goToCurrent();
    }
    save();
    render();
  }

  function pause() {
    state.pausedScreen = state.screen;
    state.screen = 'home';
    save();
    render();
  }

  function chooseOption(index) {
    if (state.answered) {
      return;
    }
    var q = makeQuestion(currentItem(), currentSeq());
    var chosen = q.options[index];
    state.selected = chosen.key;
    state.answered = true;
    if (!state.inRetry) {
      state.firstAnswered = state.firstAnswered + 1;
      if (chosen.correct) {
        state.firstCorrect = state.firstCorrect + 1;
      } else {
        state.retry.push(currentItem());
      }
    }
    updateQuestion();
  }

  function finish() {
    state.screen = 'result';
    state.finished = true;
    state.inRetry = false;
    state.pausedScreen = '';
    save();
    render();
  }

  function advance() {
    if (state.inRetry) {
      if (state.retryIdx < state.retry.length - 1) {
        state.retryIdx = state.retryIdx + 1;
        state.answered = false;
        state.selected = '';
        save();
        render();
      } else {
        finish();
      }
      return;
    }
    if (state.idx < state.task.length - 1) {
      state.idx = state.idx + 1;
      goToCurrent();
      save();
      render();
      return;
    }
    if (state.retry.length > 0) {
      state.inRetry = true;
      state.retryIdx = 0;
      state.answered = false;
      state.selected = '';
      save();
      render();
      return;
    }
    finish();
  }

  function onTap(el, fn) {
    if (!el) {
      return;
    }
    var last = 0;
    if ('ontouchend' in el) {
      el.ontouchend = function (e) {
        last = new Date().getTime();
        if (e && e.preventDefault) {
          e.preventDefault();
        }
        fn();
      };
    }
    el.onclick = function () {
      var now = new Date().getTime();
      if (now - last < 900) {
        return;
      }
      last = now;
      fn();
    };
  }

  function bindCurrent() {
    var i;
    if (state.screen === 'login') {
      var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '清空', '0', '删除'];
      for (i = 0; i < 12; i++) {
        (function (id, label) {
          onTap(document.getElementById(id), function () {
            pressKey(label);
          });
        })('k' + Math.floor(i / 3) + '' + (i % 3), keys[i]);
      }
      onTap(document.getElementById('loginBtn'), doLogin);
      return;
    }
    if (state.screen === 'home') {
      onTap(document.getElementById('startBtn'), function () {
        if (state.started) {
          resume();
        } else {
          startTask();
        }
      });
      onTap(document.getElementById('resultBtn'), function () {
        state.screen = 'result';
        render();
      });
      onTap(document.getElementById('logoutBtn'), function () {
        try {
          window.localStorage.removeItem(LS_KEY);
        } catch (e) {}
        state = defaultState();
        render();
      });
      return;
    }
    if (state.screen === 'card') {
      onTap(document.getElementById('knowBtn'), function () {
        state.screen = 'question';
        state.answered = false;
        state.selected = '';
        state.pausedScreen = '';
        save();
        render();
      });
      onTap(document.getElementById('pauseBtn'), pause);
      return;
    }
    if (state.screen === 'question') {
      for (i = 0; i < 4; i++) {
        (function (idx) {
          onTap(document.getElementById('opt' + idx), function () {
            chooseOption(idx);
          });
        })(i);
      }
      onTap(document.getElementById('nextBtn'), advance);
      onTap(document.getElementById('pauseBtn'), pause);
      return;
    }
    onTap(document.getElementById('homeBtn'), function () {
      state.screen = 'home';
      save();
      render();
    });
  }

  load();
  render();
})();
</script>
</body>
</html>
